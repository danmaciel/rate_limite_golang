version: "3"

networks:
  mynetwork:

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - mynetwork

  app-ratelimiter:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WEB_SERVER_PORT: ":8080"
      MAX_REQUISITIONS_BY_IP: ${MAX_REQUISITIONS_BY_IP:-5}
      BLACK_LIST_MINUTES_BY_IP: ${BLACK_LIST_MINUTES_BY_IP:-2}
      BLACK_LIST_MINUTES_BY_TOKEN: ${BLACK_LIST_MINUTES_BY_TOKEN:-2}
      REDIS_ADDR: redis:6379
      REDIS_PASSWD: ${REDIS_PASSWD:-}
      REDIS_DB: 0
    depends_on:
      - redis
    networks:
      - mynetwork
    command: >
      sh -c '
        apk add --no-cache redis && # Instala o redis-cli no contêiner
        while ! redis-cli -h redis -p 6379 ping > /dev/null 2>&1; do
          echo "Aguardando o Redis..." &&
          sleep 1
        done &&
        echo "Redis conectado!" &&
        ./app
      '