name: Go CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_ADDR: localhost:6379
      REDIS_PASSWD: ''
      REDIS_DB: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Run HTTP concurrency scenario and verify metrics
        shell: bash
        run: |
          go run . > "$RUNNER_TEMP/rate-limiter.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 scripts/load_test.py --requests 400 --concurrency 20
      - name: Show application log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/rate-limiter.log" 2>/dev/null || true
